<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>Camera</title>
  <!-- version: unified warm mask + separate dark-area warm tint -->

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>

  <style>
    :root{
      --ui-soft: rgba(255,255,255,.8);
      --ui-bg: rgba(0,0,0,.42);
      --ui-border: rgba(255,255,255,.12);
      --yellow: #ffd84f;
      --bottom-safe: max(14px, env(safe-area-inset-bottom));
      --top-safe: max(12px, env(safe-area-inset-top));
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{
      margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      color:#fff;
    }
    body{position:relative}
    #ar-container{
      position:fixed; inset:0; z-index:1; overflow:hidden; background:#000;
      transform-origin:center center;
    }
    #ar-container.mirror{ transform:scaleX(-1); }
    #ar-container.switching{ opacity:0; }

    .overlay-ui{ position:fixed; inset:0; pointer-events:none; z-index:20; }
    .topBlack{
      position:absolute; left:0; right:0; top:0; height:max(54px, 7.8vh); background:#000; z-index:0;
    }
    .bottomBlack{
      position:absolute; left:0; right:0; bottom:0; height:max(170px, 24vh); background:#000; z-index:0;
    }
    .topFade{
      position:absolute;left:0;right:0;top:0;height:12.5vh;min-height:58px;
      background:linear-gradient(to bottom,rgba(0,0,0,.88),rgba(0,0,0,.40),rgba(0,0,0,0)); z-index:1;
    }
    .bottomFade{
      position:absolute;left:0;right:0;bottom:0;height:30vh;min-height:180px;
      background:linear-gradient(to top,rgba(0,0,0,.98),rgba(0,0,0,.82),rgba(0,0,0,0)); z-index:1;
    }

    .cameraGuide{
      position:absolute; left:0; right:0; top:max(54px, 7.8vh); bottom:max(170px, 24vh);
      z-index:2; overflow:hidden; pointer-events:none;
    }
    .gridline{position:absolute;background:rgba(255,255,255,.30);}
    .v1,.v2{top:0;bottom:0;width:1px}
    .h1,.h2{left:0;right:0;height:1px}
    .v1{left:33.333%}.v2{left:66.666%}
    .h1{top:33.333%}.h2{top:66.666%}

    .focusCross{
      position:absolute;left:50%;top:50%;width:42px;height:42px;transform:translate(-50%,-50%);
    }
    .focusCross::before,.focusCross::after{
      content:"";position:absolute;background:var(--yellow);box-shadow:0 0 6px rgba(255,216,79,.18);
    }
    .focusCross::before{left:0;right:0;top:20px;height:2px}
    .focusCross::after{top:0;bottom:0;left:20px;width:2px}

    .statusDot{
      position:absolute;left:14px;top:var(--top-safe); width:11px;height:11px;border-radius:50%;
      background:#ff4c4c; box-shadow:0 0 8px rgba(255,76,76,.5); border:1px solid rgba(255,255,255,.28); z-index:5;
    }

    .toolbar{
      position:absolute;top:var(--top-safe);right:14px;z-index:5;
      display:flex;gap:10px;align-items:center;pointer-events:none;
    }
    .toolbar .pill{
      height:46px;padding:0 10px;border-radius:23px; display:flex;align-items:center;gap:4px;
      background:var(--ui-bg);border:1px solid var(--ui-border); backdrop-filter:blur(10px);
    }
    .iconOnly{ width:34px;height:34px;border-radius:17px; display:grid;place-items:center;background:transparent;color:#fff; }
    .iconOnly svg{ width:21px;height:21px }

    .settingsPanel{
      position:absolute; left:14px; bottom:calc(var(--bottom-safe) + 82px); z-index:30;
      width:min(270px, 64vw); padding:12px; border-radius:16px;
      background:rgba(0,0,0,.48); border:1px solid rgba(255,255,255,.12);
      backdrop-filter:blur(10px); pointer-events:auto; display:none;
    }
    .settingsPanel.open{display:block}
    .settingsTitle{ font-size:13px; font-weight:700; margin-bottom:10px; color:#fff; }
    .settingsRow{ margin-bottom:10px }
    .settingsRow label{
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      margin-bottom:4px; font-size:12px; color:rgba(255,255,255,.92);
    }
    .settingsRow input[type="range"]{ width:100% }
    .colorRow{ display:flex; gap:8px; margin-top:6px; flex-wrap:wrap; }
    .presetColor{
      width:24px;height:24px;border-radius:50%; border:1px solid rgba(255,255,255,.22);
      cursor:pointer; pointer-events:auto; padding:0;
    }

    .bottomUI{
      position:absolute;left:0;right:0;bottom:0; padding:0 18px calc(var(--bottom-safe) + 8px);
      display:flex;flex-direction:column;gap:10px; z-index:5;
    }
    .modeRow{ display:flex;justify-content:center;align-items:center;margin-bottom:2px; }
    .modePill{
      display:flex;align-items:center;gap:2px;padding:4px;border-radius:24px;
      background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.10); backdrop-filter:blur(10px);
    }
    .mode{
      min-width:84px;height:38px;border-radius:19px;display:grid;place-items:center;
      font-size:15px;font-weight:600;color:var(--ui-soft);
    }
    .mode.active{
      background:rgba(255,255,255,.11);color:var(--yellow); box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
    }

    .shutterRow{
      display:grid;grid-template-columns:64px 1fr 64px;align-items:center; padding:0 0 2px; min-height:98px;
    }
    .thumbButton{ pointer-events:auto; background:none;border:none;padding:0;justify-self:start;cursor:pointer; }
    .thumb{
      width:54px;height:54px;border-radius:50%;overflow:hidden; border:1px solid rgba(255,255,255,.18);
      background:#555; box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
    }
    .thumb img{display:block;width:100%;height:100%;object-fit:cover}
    #shutter{
      pointer-events:auto; justify-self:center;width:84px;height:84px;border-radius:50%;
      border:none;outline:none;cursor:pointer; background:#f6f6f6;
      box-shadow:0 0 0 6px rgba(255,255,255,.26), inset 0 0 0 2px rgba(0,0,0,.05);
    }
    #switchCamera{
      pointer-events:auto; justify-self:end;width:56px;height:56px;border-radius:50%;
      border:none;outline:none;cursor:pointer; display:grid;place-items:center;
      background:rgba(255,255,255,.12); backdrop-filter:blur(10px);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.08); color:#fff;
    }
    #switchCamera svg{width:32px;height:32px}
    #switchCamera:active,#shutter:active{transform:scale(.96)}

    .loader{
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      background:rgba(0,0,0,.85); z-index:40; color:white; font-size:16px; text-align:center; padding:24px;
    }
    .loader.hidden{display:none}

    @media (max-height: 740px){
      .topBlack{height:max(46px, 6.6vh)}
      .bottomBlack{height:max(150px, 22vh)}
      .topFade{min-height:50px}
      .bottomFade{min-height:150px;height:26vh}
      .cameraGuide{top:max(46px, 6.6vh); bottom:max(150px, 22vh)}
      .bottomUI{padding:0 14px calc(var(--bottom-safe) + 4px);gap:8px}
      .mode{min-width:76px;height:34px;font-size:14px}
      .shutterRow{grid-template-columns:56px 1fr 56px;min-height:86px}
      .thumb{width:48px;height:48px}
      #shutter{width:74px;height:74px;box-shadow:0 0 0 5px rgba(255,255,255,.26), inset 0 0 0 2px rgba(0,0,0,.05)}
      #switchCamera{width:50px;height:50px}
      .settingsPanel{width:min(240px, 48vw);padding:10px}
    }
  </style>
</head>
<body>
  <div id="loader" class="loader">載入中…</div>
  <div id="ar-container"></div>

  <div class="overlay-ui">
    <div class="topBlack"></div>
    <div class="bottomBlack"></div>

    <div class="cameraGuide">
      <div class="gridline v1"></div>
      <div class="gridline v2"></div>
      <div class="gridline h1"></div>
      <div class="gridline h2"></div>
      <div class="focusCross"></div>
    </div>

    <div class="topFade"></div>
    <div class="bottomFade"></div>

    <div class="statusDot" id="statusDot"></div>

    <div class="toolbar">
      <div class="pill">
        <div class="iconOnly" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4 7 7 0 0 0 20 14.5Z"/>
          </svg>
        </div>
        <div class="iconOnly" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M13 3 5 14h6l-1 7 8-11h-6l1-7Z"/>
            <path d="M3 3 21 21"/>
          </svg>
        </div>
        <div class="iconOnly" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="settingsPanel" id="settingsPanel">
      <div class="settingsTitle">牌面調整</div>
      <div class="settingsRow">
        <label><span>牌面暗度</span><span id="shadowValue">0.25</span></label>
        <input id="shadowSlider" type="range" min="0.00" max="1.00" step="0.01" value="0.25">
      </div>
      <div class="settingsRow">
        <label><span>邊緣柔邊</span><span id="featherValue">0.010</span></label>
        <input id="featherSlider" type="range" min="0.00" max="0.16" step="0.005" value="0.01">
      </div>
      <div class="settingsRow">
        <label><span>暖色紙感</span><span id="tintValue">0.34</span></label>
        <input id="tintSlider" type="range" min="0.00" max="0.85" step="0.01" value="0.34">
      </div>
      <div class="settingsRow">
        <label><span>黑色區域暖色</span><span id="darkTintValue">0.08</span></label>
        <input id="darkTintSlider" type="range" min="0.00" max="0.35" step="0.01" value="0.08">
      </div>
      <div class="settingsRow">
        <label><span>濾鏡顏色</span><input id="tintColor" type="color" value="#eadb9f" style="width:38px;height:24px;background:transparent;border:none;padding:0"></label>
        <div class="colorRow">
          <button class="presetColor" data-color="#ffffff" style="background:#ffffff"></button>
          <button class="presetColor" data-color="#f6e7c8" style="background:#f6e7c8"></button>
          <button class="presetColor" data-color="#f0df9f" style="background:#f0df9f"></button>
          <button class="presetColor" data-color="#d9e7ff" style="background:#d9e7ff"></button>
          <button class="presetColor" data-color="#ffd6d6" style="background:#ffd6d6"></button>
          <button class="presetColor" data-color="#d7ffd7" style="background:#d7ffd7"></button>
        </div>
      </div>
      <div class="settingsRow">
        <label><span>對比</span><span id="contrastValue">1.10</span></label>
        <input id="contrastSlider" type="range" min="0.80" max="1.35" step="0.01" value="1.10">
      </div>
      <div class="settingsRow">
        <label><span>飽和</span><span id="saturationValue">1.10</span></label>
        <input id="saturationSlider" type="range" min="0.80" max="1.35" step="0.01" value="1.10">
      </div>
      <div class="settingsRow">
        <label><span>卡面亮度</span><span id="cardBrightnessValue">0.93</span></label>
        <input id="cardBrightnessSlider" type="range" min="0.80" max="1.15" step="0.01" value="0.93">
      </div>
    </div>

    <div class="bottomUI">
      <div class="modeRow">
        <div class="modePill">
          <div class="mode">錄影</div>
          <div class="mode active">拍照</div>
        </div>
      </div>

      <div class="shutterRow">
        <button class="thumbButton" id="openSettings" aria-label="打開牌面設定">
          <div class="thumb">
            <img alt="" src="./card.png">
          </div>
        </button>

        <button id="shutter" aria-label="快門"></button>

        <button id="switchCamera" aria-label="切換前後鏡頭" title="切換前後鏡頭">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 7a7 7 0 0 1 10 0"/>
            <polyline points="14 4 17 7 14 10"/>
            <path d="M17 17a7 7 0 0 1-10 0"/>
            <polyline points="10 20 7 17 10 14"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { MindARThree } from "mindar-image-three";

    const loader = document.getElementById("loader");
    const statusDot = document.getElementById("statusDot");
    const shutter = document.getElementById("shutter");
    const switchCamera = document.getElementById("switchCamera");
    const container = document.getElementById("ar-container");
    const openSettings = document.getElementById("openSettings");
    const settingsPanel = document.getElementById("settingsPanel");
    const shadowSlider = document.getElementById("shadowSlider");
    const featherSlider = document.getElementById("featherSlider");
    const tintSlider = document.getElementById("tintSlider");
    const darkTintSlider = document.getElementById("darkTintSlider");
    const tintColorInput = document.getElementById("tintColor");
    const contrastSlider = document.getElementById("contrastSlider");
    const saturationSlider = document.getElementById("saturationSlider");
    const cardBrightnessSlider = document.getElementById("cardBrightnessSlider");
    const shadowValue = document.getElementById("shadowValue");
    const featherValue = document.getElementById("featherValue");
    const tintValue = document.getElementById("tintValue");
    const darkTintValue = document.getElementById("darkTintValue");
    const contrastValue = document.getElementById("contrastValue");
    const saturationValue = document.getElementById("saturationValue");
    const cardBrightnessValue = document.getElementById("cardBrightnessValue");

    let fadeAlpha = 1;
    let fadeAnimating = false;
    let fadeStart = 0;
    const fadeDuration = 180;

    let mindarThree = null;
    let renderer = null;
    let scene = null;
    let camera = null;
    let cardMaterial = null;
    let shadeMaterial = null;
    let darkMaterial = null;
    let tintMaterial = null;
    let darkTintMaterial = null;
    let currentFacingFront = false;
    let currentMaskTexture = null;
    let currentCardTexture = null;
    let currentLumaMaskTexture = null;
    let currentDarkLumaMaskTexture = null;
    let cardGroup = null;

    const CARD_W = 1.11;
    const CARD_H = 0.79;
    let darkOpacityBase = parseFloat(localStorage.getItem("camera_dark_opacity") ?? "0.25");
    let featherBase = parseFloat(localStorage.getItem("camera_feather") ?? "0.01");
    let tintOpacityBase = parseFloat(localStorage.getItem("camera_tint_opacity") ?? "0.34");
    let darkTintOpacityBase = parseFloat(localStorage.getItem("camera_dark_tint_opacity") ?? "0.08");
    let tintColorHex = localStorage.getItem("camera_tint_color") ?? "#eadb9f";
    let contrastBase = parseFloat(localStorage.getItem("camera_contrast") ?? "1.10");
    let saturationBase = parseFloat(localStorage.getItem("camera_saturation") ?? "1.10");
    let brightnessCardBase = parseFloat(localStorage.getItem("camera_card_brightness") ?? "0.93");

    function setFound(found){
      statusDot.style.background = found ? "#44d16b" : "#ff4d4d";
      statusDot.style.boxShadow = found
        ? "0 0 8px rgba(68,209,107,.65)"
        : "0 0 8px rgba(255,77,77,.55)";
    }

    function persistSettings(){
      localStorage.setItem("camera_dark_opacity", String(darkOpacityBase));
      localStorage.setItem("camera_feather", String(featherBase));
      localStorage.setItem("camera_tint_opacity", String(tintOpacityBase));
      localStorage.setItem("camera_dark_tint_opacity", String(darkTintOpacityBase));
      localStorage.setItem("camera_tint_color", tintColorHex);
      localStorage.setItem("camera_contrast", String(contrastBase));
      localStorage.setItem("camera_saturation", String(saturationBase));
      localStorage.setItem("camera_card_brightness", String(brightnessCardBase));
    }

    function updateMaterialControls(){
      shadowSlider.value = String(darkOpacityBase);
      featherSlider.value = String(featherBase);
      tintSlider.value = String(tintOpacityBase);
      darkTintSlider.value = String(darkTintOpacityBase);
      tintColorInput.value = tintColorHex;
      contrastSlider.value = String(contrastBase);
      saturationSlider.value = String(saturationBase);
      cardBrightnessSlider.value = String(brightnessCardBase);

      shadowValue.textContent = darkOpacityBase.toFixed(2);
      featherValue.textContent = featherBase.toFixed(3);
      tintValue.textContent = tintOpacityBase.toFixed(2);
      darkTintValue.textContent = darkTintOpacityBase.toFixed(2);
      contrastValue.textContent = contrastBase.toFixed(2);
      saturationValue.textContent = saturationBase.toFixed(2);
      cardBrightnessValue.textContent = brightnessCardBase.toFixed(2);

      if (shadeMaterial) shadeMaterial.opacity = fadeAlpha * 0.08;
      if (darkMaterial) darkMaterial.opacity = fadeAlpha * darkOpacityBase;
      if (tintMaterial) {
        tintMaterial.opacity = fadeAlpha * tintOpacityBase;
        tintMaterial.color.set(tintColorHex);
      }
      if (darkTintMaterial) {
        darkTintMaterial.opacity = fadeAlpha * darkTintOpacityBase;
        darkTintMaterial.color.set(tintColorHex);
      }
    }

    async function applyWideFrontCameraIfPossible() {
      try {
        const track = mindarThree?.video?.srcObject?.getVideoTracks?.()[0];
        if (!track || !track.getCapabilities) return;
        const caps = track.getCapabilities();
        if (caps.zoom && typeof caps.zoom.min === "number") {
          await track.applyConstraints({ advanced: [{ zoom: caps.zoom.min }] });
        }
      } catch (e) {
        console.warn("front camera zoom min not applied", e);
      }
    }

    if (location.protocol === "file:") {
      loader.innerHTML = "請用 http:// 或 https:// 開啟";
      throw new Error("MindARThree 需要 http/https，不支援 file://");
    }

    const loadImage = (src) => new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });

    function clamp255(v) { return Math.max(0, Math.min(255, v)); }

    function processImageData(imageData, contrast, saturation, brightnessMul) {
      const d = imageData.data;
      for (let i = 0; i < d.length; i += 4) {
        let r = d[i] * brightnessMul;
        let g = d[i + 1] * brightnessMul;
        let b = d[i + 2] * brightnessMul;

        r = ((r - 128) * contrast) + 128;
        g = ((g - 128) * contrast) + 128;
        b = ((b - 128) * contrast) + 128;

        const gray = 0.299 * r + 0.587 * g + 0.114 * b;
        r = gray + (r - gray) * saturation;
        g = gray + (g - gray) * saturation;
        b = gray + (b - gray) * saturation;

        d[i] = clamp255(r);
        d[i + 1] = clamp255(g);
        d[i + 2] = clamp255(b);
      }
      return imageData;
    }

    async function buildCardTexture() {
      const img = await loadImage("./card.png");
      const cw = 1400;
      const ch = Math.round(cw * img.height / img.width);
      const canvas = document.createElement("canvas");
      canvas.width = cw;
      canvas.height = ch;
      const ctx = canvas.getContext("2d");

      const radius = Math.round(ch * 0.07);
      const border = Math.round(ch * 0.035);
      const innerX = border;
      const innerY = border;
      const innerW = cw - border * 2;
      const innerH = ch - border * 2;

      roundedRect(ctx, 0, 0, cw, ch, radius);
      ctx.fillStyle = "#ffffff";
      ctx.fill();

      const off = document.createElement("canvas");
      off.width = innerW;
      off.height = innerH;
      const offCtx = off.getContext("2d");
      offCtx.drawImage(img, 0, 0, innerW, innerH);
      let imgData = offCtx.getImageData(0, 0, innerW, innerH);
      imgData = processImageData(imgData, contrastBase, saturationBase, brightnessCardBase);
      offCtx.putImageData(imgData, 0, 0);

      ctx.save();
      roundedRect(ctx, innerX, innerY, innerW, innerH, Math.max(8, radius - border*0.6));
      ctx.clip();
      ctx.drawImage(off, innerX, innerY);
      ctx.restore();

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.needsUpdate = true;
      return texture;
    }

    async function buildWhiteAreaMaskTexture() {
      const img = await loadImage("./card.png");
      const cw = 1400;
      const ch = Math.round(cw * img.height / img.width);

      const border = Math.round(ch * 0.035);
      const radius = Math.round(ch * 0.07);
      const innerX = border;
      const innerY = border;
      const innerW = cw - border * 2;
      const innerH = ch - border * 2;
      const innerRadius = Math.max(8, radius - border * 0.6);

      // Inner artwork mask: only white / pale regions should be warmed.
      const innerCanvas = document.createElement("canvas");
      innerCanvas.width = innerW;
      innerCanvas.height = innerH;
      const ictx = innerCanvas.getContext("2d");
      ictx.drawImage(img, 0, 0, innerW, innerH);

      const imageData = ictx.getImageData(0, 0, innerW, innerH);
      const d = imageData.data;

      for (let i = 0; i < d.length; i += 4) {
        const r = d[i], g = d[i + 1], b = d[i + 2];
        const luma = 0.299 * r + 0.587 * g + 0.114 * b;
        const maxc = Math.max(r, g, b);
        const minc = Math.min(r, g, b);
        const sat = maxc === 0 ? 0 : (maxc - minc) / maxc;

        let mask = 0;
        if (luma > 172 && sat < 0.30) {
          mask = Math.min(255, Math.max(0, (luma - 172) * 3.8));
        }

        d[i] = 255;
        d[i + 1] = 255;
        d[i + 2] = 255;
        d[i + 3] = mask;
      }
      ictx.putImageData(imageData, 0, 0);

      const blurredInner = document.createElement("canvas");
      blurredInner.width = innerW;
      blurredInner.height = innerH;
      const bctx = blurredInner.getContext("2d");
      bctx.filter = "blur(1.0px)";
      bctx.drawImage(innerCanvas, 0, 0);

      const finalCanvas = document.createElement("canvas");
      finalCanvas.width = cw;
      finalCanvas.height = ch;
      const fctx = finalCanvas.getContext("2d");
      fctx.clearRect(0, 0, cw, ch);

      // Warm the whole card base first so white border naturally gets tint.
      fctx.fillStyle = "rgba(255,255,255,1)";
      fctx.fillRect(0, 0, cw, ch);

      // Replace only the inner artwork area with the white-only mask so black symbols stay mostly untouched.
      fctx.clearRect(innerX, innerY, innerW, innerH);
      fctx.save();
      roundedRect(fctx, innerX, innerY, innerW, innerH, innerRadius);
      fctx.clip();
      fctx.drawImage(blurredInner, innerX, innerY);
      fctx.restore();

      const texture = new THREE.CanvasTexture(finalCanvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.needsUpdate = true;
      return texture;
    }

    async function buildDarkAreaMaskTexture() {
      const img = await loadImage("./card.png");
      const cw = 1400;
      const ch = Math.round(cw * img.height / img.width);
      const border = Math.round(ch * 0.035);
      const innerX = border;
      const innerY = border;
      const innerW = cw - border * 2;
      const innerH = ch - border * 2;
      const innerRadius = Math.max(8, Math.round(ch * 0.07) - border * 0.6);

      const innerCanvas = document.createElement("canvas");
      innerCanvas.width = innerW;
      innerCanvas.height = innerH;
      const ictx = innerCanvas.getContext("2d");
      ictx.drawImage(img, 0, 0, innerW, innerH);

      const imageData = ictx.getImageData(0, 0, innerW, innerH);
      const d = imageData.data;
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i], g = d[i + 1], b = d[i + 2];
        const luma = 0.299 * r + 0.587 * g + 0.114 * b;
        let mask = 0;
        if (luma < 145) {
          mask = Math.min(255, Math.max(0, (145 - luma) * 2.6));
        }
        d[i] = 255; d[i + 1] = 255; d[i + 2] = 255; d[i + 3] = mask;
      }
      ictx.putImageData(imageData, 0, 0);

      const blurredInner = document.createElement("canvas");
      blurredInner.width = innerW;
      blurredInner.height = innerH;
      const bctx = blurredInner.getContext("2d");
      bctx.filter = "blur(0.8px)";
      bctx.drawImage(innerCanvas, 0, 0);

      const finalCanvas = document.createElement("canvas");
      finalCanvas.width = cw;
      finalCanvas.height = ch;
      const fctx = finalCanvas.getContext("2d");
      fctx.clearRect(0, 0, cw, ch);

      fctx.save();
      roundedRect(fctx, innerX, innerY, innerW, innerH, innerRadius);
      fctx.clip();
      fctx.drawImage(blurredInner, innerX, innerY);
      fctx.restore();

      const texture = new THREE.CanvasTexture(finalCanvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.needsUpdate = true;
      return texture;
    }

    function buildSurfaceShadeTexture() {
      const cw = 1024, ch = 728;
      const canvas = document.createElement("canvas");
      canvas.width = cw;
      canvas.height = ch;
      const ctx = canvas.getContext("2d");

      ctx.clearRect(0,0,cw,ch);
      const grad = ctx.createLinearGradient(0, 0, cw, ch);
      grad.addColorStop(0, "rgba(255,255,255,0.16)");
      grad.addColorStop(0.18, "rgba(255,255,255,0.05)");
      grad.addColorStop(0.45, "rgba(255,255,255,0)");
      grad.addColorStop(1, "rgba(0,0,0,0.24)");
      roundedRect(ctx, 0, 0, cw, ch, 54);
      ctx.fillStyle = grad;
      ctx.fill();

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.needsUpdate = true;
      return texture;
    }

    function buildFeatheredMaskTexture(feather = 0) {
      const cw = 1024, ch = 728;
      const canvas = document.createElement("canvas");
      canvas.width = cw;
      canvas.height = ch;
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0,0,cw,ch);

      const maxPad = Math.round(Math.min(cw, ch) * 0.18);
      const pad = Math.round(maxPad * feather / 0.16);
      const blurPx = feather > 0 ? Math.max(1, Math.round(12 * feather / 0.16)) : 0;
      const radius = Math.max(10, 54 - Math.round(pad * 0.35));

      if (blurPx > 0) ctx.filter = `blur(${blurPx}px)`;
      roundedRect(ctx, pad, pad, cw - pad * 2, ch - pad * 2, radius);
      ctx.fillStyle = "#ffffff";
      ctx.fill();

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.needsUpdate = true;
      return texture;
    }

    function buildRoundedMaskTexture() {
      return buildFeatheredMaskTexture(featherBase);
    }

    function roundedRect(ctx, x, y, w, h, r) {
      const rr = Math.min(r, w/2, h/2);
      ctx.beginPath();
      ctx.moveTo(x + rr, y);
      ctx.lineTo(x + w - rr, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
      ctx.lineTo(x + w, y + h - rr);
      ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
      ctx.lineTo(x + rr, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
      ctx.lineTo(x, y + rr);
      ctx.quadraticCurveTo(x, y, x + rr, y);
      ctx.closePath();
    }

    function updateFade(now){
      if(!fadeAnimating) return;
      const t = Math.min(1, (now - fadeStart) / fadeDuration);
      fadeAlpha = 1 - t;
      if(t >= 1){
        fadeAlpha = 0;
        fadeAnimating = false;
      }
      if (cardMaterial) cardMaterial.opacity = fadeAlpha;
      updateMaterialControls();
    }

    async function refreshCardTexture() {
      if (!cardMaterial) return;
      const newTexture = await buildCardTexture();
      const old = currentCardTexture;
      currentCardTexture = newTexture;
      cardMaterial.map = newTexture;
      cardMaterial.needsUpdate = true;
      if (old) old.dispose();

      if (tintMaterial) {
        const newWhiteMask = await buildWhiteAreaMaskTexture();
        const oldWhiteMask = currentLumaMaskTexture;
        currentLumaMaskTexture = newWhiteMask;
        tintMaterial.map = newWhiteMask;
        tintMaterial.needsUpdate = true;
        if (oldWhiteMask) oldWhiteMask.dispose();
      }
      if (darkTintMaterial) {
        const newDarkMask = await buildDarkAreaMaskTexture();
        const oldDarkMask = currentDarkLumaMaskTexture;
        currentDarkLumaMaskTexture = newDarkMask;
        darkTintMaterial.map = newDarkMask;
        darkTintMaterial.needsUpdate = true;
        if (oldDarkMask) oldDarkMask.dispose();
      }
    }

    async function stopCurrent() {
      if (mindarThree) {
        try {
          renderer?.setAnimationLoop(null);
          await mindarThree.stop();
        } catch (e) {
          console.warn(e);
        }
      }
      if (currentMaskTexture) {
        currentMaskTexture.dispose();
        currentMaskTexture = null;
      }
      if (currentCardTexture) {
        currentCardTexture.dispose();
        currentCardTexture = null;
      }
      if (currentLumaMaskTexture) {
        currentLumaMaskTexture.dispose();
        currentLumaMaskTexture = null;
      }
      if (currentDarkLumaMaskTexture) {
        currentDarkLumaMaskTexture.dispose();
        currentDarkLumaMaskTexture = null;
      }
      container.innerHTML = "";
      mindarThree = null;
      renderer = null;
      scene = null;
      camera = null;
      cardMaterial = null;
      shadeMaterial = null;
      darkMaterial = null;
      tintMaterial = null;
      darkTintMaterial = null;
      cardGroup = null;
      setFound(false);
    }

    async function startAR() {
      loader.classList.remove("hidden");
      container.classList.add("switching");
      await stopCurrent();

      try {
        container.classList.toggle("mirror", currentFacingFront);

        mindarThree = new MindARThree({
          container,
          imageTargetSrc: "./targets.mind",
          uiLoading: "no",
          uiScanning: "no",
          uiError: "no",
          filterMinCF: 0.001,
          filterBeta: 10,
          warmupTolerance: 2,
          missTolerance: 10,
          shouldFaceUser: currentFacingFront
        });

        ({renderer, scene, camera} = mindarThree);

        renderer.setClearColor(0x000000, 0);
        renderer.setPixelRatio(window.devicePixelRatio);

        const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
        scene.add(light);

        const anchor = mindarThree.addAnchor(0);

        const cardTexture = await buildCardTexture();
        currentCardTexture = cardTexture;
        const surfaceShadeTexture = buildSurfaceShadeTexture();
        const roundedMaskTexture = buildRoundedMaskTexture();
        currentMaskTexture = roundedMaskTexture;
        const whiteAreaMaskTexture = await buildWhiteAreaMaskTexture();
        currentLumaMaskTexture = whiteAreaMaskTexture;
        const darkAreaMaskTexture = await buildDarkAreaMaskTexture();
        currentDarkLumaMaskTexture = darkAreaMaskTexture;

        const geometry = new THREE.PlaneGeometry(CARD_W, CARD_H);
        cardMaterial = new THREE.MeshBasicMaterial({
          map: cardTexture,
          alphaMap: roundedMaskTexture,
          transparent: true,
          opacity: 1,
          side: THREE.DoubleSide,
          depthWrite: false
        });
        cardGroup = anchor.group;
        cardGroup.visible = false;

        const cardPlane = new THREE.Mesh(geometry, cardMaterial);
        cardPlane.position.z = 0.01;
        cardGroup.add(cardPlane);

        shadeMaterial = new THREE.MeshBasicMaterial({
          map: surfaceShadeTexture,
          transparent: true,
          opacity: 0.10,
          side: THREE.DoubleSide,
          depthWrite: false
        });
        const sheenPlane = new THREE.Mesh(new THREE.PlaneGeometry(CARD_W, CARD_H), shadeMaterial);
        sheenPlane.position.set(0, 0, 0.0115);
        cardGroup.add(sheenPlane);

        darkMaterial = new THREE.MeshBasicMaterial({
          map: roundedMaskTexture,
          color: "#000000",
          transparent: true,
          opacity: darkOpacityBase,
          side: THREE.DoubleSide,
          depthWrite: false
        });
        const darkPlane = new THREE.Mesh(new THREE.PlaneGeometry(CARD_W, CARD_H), darkMaterial);
        darkPlane.position.set(0, 0, 0.0124);
        cardGroup.add(darkPlane);

        tintMaterial = new THREE.MeshBasicMaterial({
          alphaMap: roundedMaskTexture,
          map: whiteAreaMaskTexture,
          color: tintColorHex,
          transparent: true,
          opacity: tintOpacityBase,
          alphaTest: 0.04,
          side: THREE.DoubleSide,
          depthWrite: false
        });
        const tintPlane = new THREE.Mesh(new THREE.PlaneGeometry(CARD_W, CARD_H), tintMaterial);
        tintPlane.position.set(0, 0, 0.013);
        cardGroup.add(tintPlane);

        darkTintMaterial = new THREE.MeshBasicMaterial({
          alphaMap: roundedMaskTexture,
          map: darkAreaMaskTexture,
          color: tintColorHex,
          transparent: true,
          opacity: darkTintOpacityBase,
          alphaTest: 0.04,
          side: THREE.DoubleSide,
          depthWrite: false
        });
        const darkTintPlane = new THREE.Mesh(new THREE.PlaneGeometry(CARD_W, CARD_H), darkTintMaterial);
        darkTintPlane.position.set(0, 0, 0.0129);
        cardGroup.add(darkTintPlane);

        updateMaterialControls();

        anchor.onTargetFound = () => {
          if (cardGroup) cardGroup.visible = true;
          setFound(true);
        };
        anchor.onTargetLost = () => {
          if (cardGroup) cardGroup.visible = false;
          setFound(false);
        };

        await mindarThree.start();
        if (currentFacingFront) await applyWideFrontCameraIfPossible();
        loader.classList.add("hidden");
        requestAnimationFrame(() => container.classList.remove("switching"));

        renderer.setAnimationLoop(() => {
          updateFade(performance.now());
          renderer.render(scene, camera);
        });
      } catch (err) {
        console.error(err);
        container.classList.remove("switching");
        loader.innerHTML = "啟動失敗";
      }
    }

    shutter.addEventListener("click", () => {
      fadeAlpha = 1;
      fadeAnimating = false;
      if (cardMaterial) cardMaterial.opacity = 1;
      updateMaterialControls();
    });

    document.body.addEventListener("click", (e) => {
      const isButton = e.target.closest("#shutter") || e.target.closest("#switchCamera") || e.target.closest("#openSettings") || e.target.closest("#settingsPanel");
      if(isButton) return;
      if (fadeAnimating || fadeAlpha <= 0.02) return;
      fadeAnimating = true;
      fadeStart = performance.now();
    });

    switchCamera.addEventListener("click", async () => {
      container.classList.add("switching");
      try {
        if (mindarThree && typeof mindarThree.switchCamera === "function") {
          await mindarThree.switchCamera();
          currentFacingFront = !currentFacingFront;
          container.classList.toggle("mirror", currentFacingFront);
          if (currentFacingFront) await applyWideFrontCameraIfPossible();
          requestAnimationFrame(() => container.classList.remove("switching"));
        } else {
          currentFacingFront = !currentFacingFront;
          await startAR();
        }
      } catch (e) {
        console.warn(e);
        currentFacingFront = !currentFacingFront;
        await startAR();
      }
    });

    openSettings.addEventListener("click", (e) => {
      e.stopPropagation();
      settingsPanel.classList.toggle("open");
    });
    settingsPanel.addEventListener("click", (e) => e.stopPropagation());

    shadowSlider.addEventListener("input", () => {
      darkOpacityBase = parseFloat(shadowSlider.value);
      persistSettings();
      updateMaterialControls();
    });

    featherSlider.addEventListener("input", () => {
      featherBase = parseFloat(featherSlider.value);
      persistSettings();
      const newMask = buildFeatheredMaskTexture(featherBase);
      if (currentMaskTexture) currentMaskTexture.dispose();
      currentMaskTexture = newMask;
      if (cardMaterial) {
        cardMaterial.alphaMap = newMask;
        cardMaterial.needsUpdate = true;
      }
      if (darkMaterial) {
        darkMaterial.map = newMask;
        darkMaterial.needsUpdate = true;
      }
      if (tintMaterial) {
        tintMaterial.alphaMap = newMask;
        tintMaterial.needsUpdate = true;
      }
      if (darkTintMaterial) {
        darkTintMaterial.alphaMap = newMask;
        darkTintMaterial.needsUpdate = true;
      }
      updateMaterialControls();
    });

    tintSlider.addEventListener("input", () => {
      tintOpacityBase = parseFloat(tintSlider.value);
      persistSettings();
      updateMaterialControls();
    });

    darkTintSlider.addEventListener("input", () => {
      darkTintOpacityBase = parseFloat(darkTintSlider.value);
      persistSettings();
      updateMaterialControls();
    });

    contrastSlider.addEventListener("input", async () => {
      contrastBase = parseFloat(contrastSlider.value);
      persistSettings();
      await refreshCardTexture();
      updateMaterialControls();
    });

    saturationSlider.addEventListener("input", async () => {
      saturationBase = parseFloat(saturationSlider.value);
      persistSettings();
      await refreshCardTexture();
      updateMaterialControls();
    });

    cardBrightnessSlider.addEventListener("input", async () => {
      brightnessCardBase = parseFloat(cardBrightnessSlider.value);
      persistSettings();
      await refreshCardTexture();
      updateMaterialControls();
    });

    tintColorInput.addEventListener("input", () => {
      tintColorHex = tintColorInput.value;
      persistSettings();
      updateMaterialControls();
    });
    document.querySelectorAll(".presetColor").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        tintColorHex = btn.dataset.color;
        tintColorInput.value = tintColorHex;
        persistSettings();
        updateMaterialControls();
      });
    });

    document.body.addEventListener("click", () => {
      settingsPanel.classList.remove("open");
    }, true);

    setFound(false);
    updateMaterialControls();
    await startAR();
    container.classList.toggle("mirror", currentFacingFront);
  </script>
</body>
</html>
