<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>MindAR Three Card Prototype v5</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>

  <style>
    :root{
      --ui-soft: rgba(255,255,255,.8);
      --ui-bg: rgba(0,0,0,.42);
      --ui-border: rgba(255,255,255,.12);
      --yellow: #ffd84f;
      --bottom-safe: max(14px, env(safe-area-inset-bottom));
      --top-safe: max(12px, env(safe-area-inset-top));
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{
      margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      color:#fff;
    }
    body{position:relative}
    #ar-container{
      position:fixed;
      inset:0;
      z-index:1;
      overflow:hidden;
      background:#000;
    }

    .overlay-ui{
      position:fixed; inset:0; pointer-events:none; z-index:20;
    }
    .topFade{
      position:absolute;left:0;right:0;top:0;height:16vh;min-height:86px;
      background:linear-gradient(to bottom,rgba(0,0,0,.76),rgba(0,0,0,.26),rgba(0,0,0,0));
    }
    .bottomFade{
      position:absolute;left:0;right:0;bottom:0;height:28vh;min-height:170px;
      background:linear-gradient(to top,rgba(0,0,0,.95),rgba(0,0,0,.78),rgba(0,0,0,0));
    }

    .gridline{position:absolute;background:rgba(255,255,255,.30)}
    .v1,.v2{top:0;bottom:0;width:1px}
    .h1,.h2{left:0;right:0;height:1px}
    .v1{left:33.333%}.v2{left:66.666%}
    .h1{top:33.333%}.h2{top:66.666%}

    .focusCross{
      position:absolute;left:50%;top:50%;width:42px;height:42px;transform:translate(-50%,-50%);
    }
    .focusCross::before,.focusCross::after{
      content:"";position:absolute;background:var(--yellow);box-shadow:0 0 6px rgba(255,216,79,.18);
    }
    .focusCross::before{left:0;right:0;top:20px;height:2px}
    .focusCross::after{top:0;bottom:0;left:20px;width:2px}

    .statusDot{
      position:absolute;left:14px;top:var(--top-safe);
      width:11px;height:11px;border-radius:50%;
      background:#ff4c4c;
      box-shadow:0 0 8px rgba(255,76,76,.5);
      border:1px solid rgba(255,255,255,.28);
    }

    .bottomUI{
      position:absolute;left:0;right:0;bottom:0;
      padding:0 18px calc(var(--bottom-safe) + 8px);
      display:flex;flex-direction:column;gap:10px;
    }
    .modeRow{
      display:flex;justify-content:center;align-items:center;margin-bottom:2px;
    }
    .modePill{
      display:flex;align-items:center;gap:2px;padding:4px;border-radius:24px;
      background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.10);
      backdrop-filter:blur(10px);
    }
    .mode{
      min-width:84px;height:38px;border-radius:19px;display:grid;place-items:center;
      font-size:15px;font-weight:600;color:var(--ui-soft);
    }
    .mode.active{
      background:rgba(255,255,255,.11);color:var(--yellow);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
    }

    .shutterRow{
      display:grid;grid-template-columns:64px 1fr 64px;align-items:center;
      padding:0 0 2px; min-height:98px;
    }
    .thumb{
      width:54px;height:54px;border-radius:50%;overflow:hidden;justify-self:start;
      border:1px solid rgba(255,255,255,.18);background:#555;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
    }
    .thumb img{display:block;width:100%;height:100%;object-fit:cover}
    #shutter{
      pointer-events:auto;
      justify-self:center;width:84px;height:84px;border-radius:50%;border:none;outline:none;cursor:pointer;
      background:#f6f6f6;
      box-shadow:0 0 0 6px rgba(255,255,255,.26), inset 0 0 0 2px rgba(0,0,0,.05);
    }
    #switchCamera{
      pointer-events:auto;
      justify-self:end;width:56px;height:56px;border-radius:50%;border:none;outline:none;cursor:pointer;
      display:grid;place-items:center;background:rgba(255,255,255,.12);
      backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
      color:#fff;
    }
    #switchCamera svg{width:32px;height:32px}
    #switchCamera:active,#shutter:active{transform:scale(.96)}

    .loader{
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      background:rgba(0,0,0,.85); z-index:40; color:white; font-size:16px;
      text-align:center; padding:24px;
    }
    .loader.hidden{display:none}

    @media (max-height: 740px){
      .topFade{min-height:72px}
      .bottomFade{min-height:150px;height:25vh}
      .bottomUI{padding:0 14px calc(var(--bottom-safe) + 4px);gap:8px}
      .mode{min-width:76px;height:34px;font-size:14px}
      .shutterRow{grid-template-columns:56px 1fr 56px;min-height:86px}
      .thumb{width:48px;height:48px}
      #shutter{width:74px;height:74px;box-shadow:0 0 0 5px rgba(255,255,255,.26), inset 0 0 0 2px rgba(0,0,0,.05)}
      #switchCamera{width:50px;height:50px}
    }
  </style>
</head>
<body>
  <div id="loader" class="loader">載入中…<br>請用 http:// 或 https:// 開啟，不要用 file://</div>
  <div id="ar-container"></div>

  <div class="overlay-ui">
    <div class="gridline v1"></div>
    <div class="gridline v2"></div>
    <div class="gridline h1"></div>
    <div class="gridline h2"></div>
    <div class="focusCross"></div>

    <div class="topFade"></div>
    <div class="bottomFade"></div>

    <div class="statusDot" id="statusDot"></div>

    <div class="bottomUI">
      <div class="modeRow">
        <div class="modePill">
          <div class="mode">錄影</div>
          <div class="mode active">拍照</div>
        </div>
      </div>

      <div class="shutterRow">
        <div class="thumb" aria-hidden="true">
          <img alt="" src="./card.png">
        </div>

        <button id="shutter" aria-label="快門"></button>

        <button id="switchCamera" aria-label="切換前後鏡頭" title="切換前後鏡頭">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 7a7 7 0 0 1 10 0"/>
            <polyline points="14 4 17 7 14 10"/>
            <path d="M17 17a7 7 0 0 1-10 0"/>
            <polyline points="10 20 7 17 10 14"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { MindARThree } from "mindar-image-three";

    const loader = document.getElementById("loader");
    const statusDot = document.getElementById("statusDot");
    const shutter = document.getElementById("shutter");
    const switchCamera = document.getElementById("switchCamera");
    const container = document.getElementById("ar-container");

    let fadeAlpha = 1;
    let fadeAnimating = false;
    let fadeStart = 0;
    const fadeDuration = 180;

    let mindarThree = null;
    let renderer = null;
    let scene = null;
    let camera = null;
    let material = null;
    let currentFacingFront = false;

    const CARD_W = 1.11;
    const CARD_H = 0.79;

    function setFound(found){
      statusDot.style.background = found ? "#44d16b" : "#ff4d4d";
      statusDot.style.boxShadow = found
        ? "0 0 8px rgba(68,209,107,.65)"
        : "0 0 8px rgba(255,77,77,.55)";
    }

    if (location.protocol === "file:") {
      loader.innerHTML = "請不要用 file:// 開啟<br>請改用 GitHub Pages、Live Server 或 http://localhost";
      throw new Error("MindARThree 需要 http/https，不支援 file://");
    }

    const loadImage = (src) => new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });

    async function buildCardTexture() {
      const img = await loadImage("./card.png");
      const cw = 1400;
      const ch = Math.round(cw * img.height / img.width); // keep source aspect
      const canvas = document.createElement("canvas");
      canvas.width = cw;
      canvas.height = ch;
      const ctx = canvas.getContext("2d");

      const radius = Math.round(ch * 0.07);
      const border = Math.round(ch * 0.04);
      const innerX = border;
      const innerY = border;
      const innerW = cw - border * 2;
      const innerH = ch - border * 2;

      // white rounded border background
      roundedRect(ctx, 0, 0, cw, ch, radius);
      ctx.fillStyle = "#ffffff";
      ctx.fill();

      // clip image into rounded rect inset to create border
      ctx.save();
      roundedRect(ctx, innerX, innerY, innerW, innerH, Math.max(8, radius - border*0.6));
      ctx.clip();
      ctx.drawImage(img, innerX, innerY, innerW, innerH);
      ctx.restore();

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.needsUpdate = true;
      return texture;
    }

    function buildShadowTexture() {
      const cw = 1024, ch = 728;
      const canvas = document.createElement("canvas");
      canvas.width = cw;
      canvas.height = ch;
      const ctx = canvas.getContext("2d");

      ctx.clearRect(0,0,cw,ch);
      ctx.filter = "blur(28px)";
      ctx.fillStyle = "rgba(0,0,0,0.38)";
      roundedRect(ctx, 70, 70, cw-140, ch-140, 54);
      ctx.fill();

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.needsUpdate = true;
      return texture;
    }

    function roundedRect(ctx, x, y, w, h, r) {
      const rr = Math.min(r, w/2, h/2);
      ctx.beginPath();
      ctx.moveTo(x + rr, y);
      ctx.lineTo(x + w - rr, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
      ctx.lineTo(x + w, y + h - rr);
      ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
      ctx.lineTo(x + rr, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
      ctx.lineTo(x, y + rr);
      ctx.quadraticCurveTo(x, y, x + rr, y);
      ctx.closePath();
    }

    function updateFade(now){
      if(!fadeAnimating || !material) return;
      const t = Math.min(1, (now - fadeStart) / fadeDuration);
      fadeAlpha = 1 - t;
      if(t >= 1){
        fadeAlpha = 0;
        fadeAnimating = false;
      }
      material.opacity = fadeAlpha;
    }

    async function stopCurrent() {
      if (mindarThree) {
        try {
          renderer?.setAnimationLoop(null);
          await mindarThree.stop();
        } catch (e) {
          console.warn(e);
        }
      }
      container.innerHTML = "";
      mindarThree = null;
      renderer = null;
      scene = null;
      camera = null;
      material = null;
      setFound(false);
    }

    async function startAR() {
      loader.classList.remove("hidden");
      await stopCurrent();

      try {
        mindarThree = new MindARThree({
          container,
          imageTargetSrc: "./targets.mind",
          uiLoading: "no",
          uiScanning: "no",
          uiError: "no",
          filterMinCF: 0.001,
          filterBeta: 10,
          warmupTolerance: 2,
          missTolerance: 10,
          shouldFaceUser: currentFacingFront // best-effort toggle
        });

        ({renderer, scene, camera} = mindarThree);

        renderer.setClearColor(0x000000, 0);
        renderer.setPixelRatio(window.devicePixelRatio);

        const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
        scene.add(light);

        const anchor = mindarThree.addAnchor(0);

        const cardTexture = await buildCardTexture();
        const shadowTexture = buildShadowTexture();

        const shadowMat = new THREE.MeshBasicMaterial({
          map: shadowTexture,
          transparent: true,
          opacity: 0.34,
          side: THREE.DoubleSide,
          depthWrite: false
        });
        const shadowPlane = new THREE.Mesh(
          new THREE.PlaneGeometry(CARD_W * 1.05, CARD_H * 1.05),
          shadowMat
        );
        shadowPlane.position.set(0.015, -0.015, -0.01);
        anchor.group.add(shadowPlane);

        const geometry = new THREE.PlaneGeometry(CARD_W, CARD_H);
        material = new THREE.MeshBasicMaterial({
          map: cardTexture,
          transparent: true,
          opacity: 1,
          side: THREE.DoubleSide,
          depthWrite: false
        });
        const plane = new THREE.Mesh(geometry, material);
        plane.position.z = 0.01;
        anchor.group.add(plane);

        anchor.onTargetFound = () => setFound(true);
        anchor.onTargetLost = () => setFound(false);

        await mindarThree.start();
        loader.classList.add("hidden");

        renderer.setAnimationLoop(() => {
          updateFade(performance.now());
          renderer.render(scene, camera);
        });
      } catch (err) {
        console.error(err);
        loader.innerHTML = "啟動失敗<br>請確認 targets.mind、card.png、相機權限，以及用 http/https 開啟";
      }
    }

    shutter.addEventListener("click", () => {
      fadeAlpha = 1;
      fadeAnimating = false;
      if (material) material.opacity = 1;
    });

    document.body.addEventListener("click", (e) => {
      const isButton = e.target.closest("#shutter") || e.target.closest("#switchCamera");
      if(isButton) return;
      fadeAnimating = true;
      fadeStart = performance.now();
    });

    switchCamera.addEventListener("click", async () => {
      currentFacingFront = !currentFacingFront;
      await startAR();
    });

    setFound(false);
    await startAR();
  </script>
</body>
</html>
