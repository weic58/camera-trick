  <script>
    const videoElement = document.getElementById('camera-feed');
    const canvasElement = document.getElementById('overlay-canvas');
    const overlayCtx = canvasElement.getContext('2d');
    const magicCardImg = document.getElementById('magic-card');
    const shutterBtn = document.getElementById('shutter-btn');
    const cameraContainer = document.getElementById('camera-container');

    let streaming = false;
    let cardMat = null;
    let overlayOpacity = 1.0;
    let isFading = false;
    let replayRequested = false;
    let resetTrackingRequested = false;

    function replayMagicEffect() {
      overlayOpacity = 1.0;
      isFading = false;
      replayRequested = true;
      resetTrackingRequested = true;
    }

    shutterBtn.addEventListener('click', (event) => {
      event.stopPropagation();
      replayMagicEffect();
    });

    cameraContainer.addEventListener('click', () => {
      if (overlayOpacity > 0.02) isFading = true;
    });

    function loadCardImage() {
      if (cvReady && magicCardImg.complete && magicCardImg.naturalWidth > 0) {
        cardMat = cv.imread(magicCardImg);
        if (cardMat.type() === cv.CV_8UC3) cv.cvtColor(cardMat, cardMat, cv.COLOR_RGB2RGBA);
        console.log('疊加圖片載入完成');
      } else {
        setTimeout(loadCardImage, 100);
      }
    }
    loadCardImage();

    videoElement.addEventListener('canplay', function() {
      if (!streaming && videoElement.videoWidth > 0 && videoElement.videoHeight > 0) {
        videoElement.setAttribute('width', videoElement.videoWidth);
        videoElement.setAttribute('height', videoElement.videoHeight);
        canvasElement.width = videoElement.videoWidth;
        canvasElement.height = videoElement.videoHeight;
        streaming = true;
        startProcessing();
      }
    }, false);

    async function initCamera() {
      try {
        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
            audio: false
          });
        } catch (e) {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user', width: { ideal: 1920 }, height: { ideal: 1080 } },
            audio: false
          });
        }
        videoElement.srcObject = stream;
      } catch (error) {
        console.error('相機存取失敗:', error);
        alert('無法存取相機，請確認已給予瀏覽器相機權限。');
      }
    }
    initCamera();

    function getCosine(pt1, pt0, pt2) {
      let dx1 = pt1.x - pt0.x, dy1 = pt1.y - pt0.y;
      let dx2 = pt2.x - pt0.x, dy2 = pt2.y - pt0.y;
      return (dx1 * dx2 + dy1 * dy2) / Math.sqrt((dx1 * dx1 + dy1 * dy1) * (dx2 * dx2 + dy2 * dy2) + 1e-10);
    }

    function getMaxCosine(pts) {
      let maxCosine = 0;
      for (let i = 0; i < 4; i++) {
        let cosine = Math.abs(getCosine(pts[i % 4], pts[(i + 1) % 4], pts[(i + 2) % 4]));
        maxCosine = Math.max(maxCosine, cosine);
      }
      return maxCosine;
    }

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function orderPointsClockwise(pts) {
      const center = { x: pts.reduce((s, p) => s + p.x, 0) / pts.length, y: pts.reduce((s, p) => s + p.y, 0) / pts.length };
      const sorted = pts
        .map(p => ({ ...p, angle: Math.atan2(p.y - center.y, p.x - center.x) }))
        .sort((a, b) => a.angle - b.angle)
        .map(({ angle, ...p }) => p);

      let startIdx = 0;
      let minSum = Infinity;
      for (let i = 0; i < sorted.length; i++) {
        const sum = sorted[i].x + sorted[i].y;
        if (sum < minSum) { minSum = sum; startIdx = i; }
      }

      const ordered = [];
      for (let i = 0; i < sorted.length; i++) ordered.push(sorted[(startIdx + i) % sorted.length]);

      const cross = (ordered[1].x - ordered[0].x) * (ordered[2].y - ordered[1].y) - (ordered[1].y - ordered[0].y) * (ordered[2].x - ordered[1].x);
      return cross < 0 ? [ordered[0], ordered[3], ordered[2], ordered[1]] : ordered;
    }

    function getQuadMetrics(points) {
      const top = distance(points[0], points[1]);
      const right = distance(points[1], points[2]);
      const bottom = distance(points[2], points[3]);
      const left = distance(points[3], points[0]);
      const avgW = (top + bottom) / 2;
      const avgH = (left + right) / 2;
      return { top, right, bottom, left, avgW, avgH, longSide: Math.max(avgW, avgH), shortSide: Math.max(1, Math.min(avgW, avgH)) };
    }

    function getQuadCenter(points) {
      return { x: (points[0].x + points[1].x + points[2].x + points[3].x) / 4, y: (points[0].y + points[1].y + points[2].y + points[3].y) / 4 };
    }

    function getQuadAngle(points) {
      return Math.atan2(points[1].y - points[0].y, points[1].x - points[0].x);
    }

    function angleDifference(a, b) {
      let d = Math.abs(a - b) % Math.PI;
      if (d > Math.PI / 2) d = Math.PI - d;
      return d;
    }

    function quadArea(points) {
      let area = 0;
      for (let i = 0; i < 4; i++) {
        const j = (i + 1) % 4;
        area += points[i].x * points[j].y - points[j].x * points[i].y;
      }
      return Math.abs(area) * 0.5;
    }

    function averagePointDistance(a, b) {
      if (!a || !b) return Infinity;
      let sum = 0;
      for (let i = 0; i < 4; i++) sum += distance(a[i], b[i]);
      return sum / 4;
    }

    function blendPoints(prev, next, alpha) {
      return prev.map((p, i) => ({ x: p.x * (1 - alpha) + next[i].x * alpha, y: p.y * (1 - alpha) + next[i].y * alpha }));
    }

    function ensureAspectMatch(points, srcW, srcH) {
      const { avgW, avgH } = getQuadMetrics(points);
      const dstLandscape = avgW >= avgH;
      const srcLandscape = srcW >= srcH;
      return dstLandscape !== srcLandscape ? [points[1], points[2], points[3], points[0]] : points;
    }

    function isAspectRatioClose(points, srcW, srcH, tolerance = 0.26) {
      const { longSide, shortSide } = getQuadMetrics(points);
      const detectedRatio = longSide / shortSide;
      const srcRatio = Math.max(srcW, srcH) / Math.max(1, Math.min(srcW, srcH));
      return Math.abs(detectedRatio - srcRatio) / srcRatio <= tolerance;
    }

    function candidateMatchesTrack(points, trackedPoints, width, height) {
      if (!trackedPoints) return true;
      const c1 = getQuadCenter(points);
      const c2 = getQuadCenter(trackedPoints);
      const centerDist = distance(c1, c2);
      const frameDiag = Math.hypot(width, height);
      const m1 = getQuadMetrics(points);
      const m2 = getQuadMetrics(trackedPoints);
      const sizeRatio = m1.longSide / Math.max(1, m2.longSide);
      const sizeChange = sizeRatio > 1 ? sizeRatio : 1 / Math.max(0.0001, sizeRatio);
      const angleDelta = angleDifference(getQuadAngle(points), getQuadAngle(trackedPoints));
      return centerDist < frameDiag * 0.11 && sizeChange < 1.35 && angleDelta < 0.35;
    }

    function rotatedRectToPoints(rect) {
      const angle = rect.angle * Math.PI / 180;
      const b = Math.cos(angle) * 0.5;
      const a = Math.sin(angle) * 0.5;
      const w = rect.size.width;
      const h = rect.size.height;
      const cx = rect.center.x;
      const cy = rect.center.y;
      return [
        { x: cx - a * h - b * w, y: cy + b * h - a * w },
        { x: cx + a * h - b * w, y: cy - b * h - a * w },
        { x: cx + a * h + b * w, y: cy - b * h + a * w },
        { x: cx - a * h + b * w, y: cy + b * h + a * w }
      ];
    }

    function clampPoint(p, width, height) {
      return { x: Math.min(width - 1, Math.max(0, p.x)), y: Math.min(height - 1, Math.max(0, p.y)) };
    }

    function clampQuad(points, width, height) {
      return points.map(p => clampPoint(p, width, height));
    }

    function scaleQuad(points, scale) {
      const c = getQuadCenter(points);
      return points.map(p => ({ x: c.x + (p.x - c.x) * scale, y: c.y + (p.y - c.y) * scale }));
    }

    function scoreCandidate(points, contourArea, srcW, srcH, frameArea, width, height, trackedPoints = null) {
      const { top, right, bottom, left, longSide, shortSide } = getQuadMetrics(points);
      const qArea = Math.max(1, quadArea(points));
      const detectedRatio = longSide / shortSide;
      const srcRatio = Math.max(srcW, srcH) / Math.max(1, Math.min(srcW, srcH));
      const ratioError = Math.abs(detectedRatio - srcRatio) / srcRatio;
      const fillRatio = Math.min(1, contourArea / qArea);
      const center = getQuadCenter(points);
      const centerBias = 1 - Math.min(1, distance(center, { x: width / 2, y: height / 2 }) / (Math.min(width, height) * 0.55));
      const sideBalance = 1 - 0.5 * (Math.abs(top - bottom) / Math.max(1, top + bottom)) - 0.5 * (Math.abs(left - right) / Math.max(1, left + right));
      let trackBonus = 0;
      if (trackedPoints) trackBonus = 1 - Math.min(1, averagePointDistance(points, trackedPoints) / 60);
      return fillRatio * 2.2 + sideBalance * 0.9 + centerBias * 0.9 + trackBonus * 2.2 - ratioError * 2.8 + Math.min(1, qArea / frameArea) * 0.8;
    }

    function startProcessing() {
      if (!cvReady || !streaming || videoElement.videoWidth === 0) {
        setTimeout(startProcessing, 500);
        return;
      }

      console.log('開始透視疊圖迴圈...');
      const width = videoElement.videoWidth;
      const height = videoElement.videoHeight;
      const frameArea = width * height;

      const hiddenCanvas = document.createElement('canvas');
      hiddenCanvas.width = width;
      hiddenCanvas.height = height;
      const hiddenCtx = hiddenCanvas.getContext('2d', { willReadFrequently: true });

      const warpCanvas = document.createElement('canvas');
      warpCanvas.width = width;
      warpCanvas.height = height;
      const warpCtx = warpCanvas.getContext('2d');

      const gray = new cv.Mat(height, width, cv.CV_8UC1);
      const edges = new cv.Mat(height, width, cv.CV_8UC1);
      const kernel = cv.Mat.ones(5, 5, cv.CV_8U);
      const FPS = 30;

      let smoothedPoints = null;
      let stablePoints = null;
      let stableFrameCount = 0;
      let missingFrames = 0;
      const MAX_MISSING_FRAMES = 12;
      const LOCK_AFTER_FRAMES = 2;
      const JUMP_REJECT_DISTANCE = 65;

      function processVideo() {
        try {
          if (!streaming) return;
          const begin = Date.now();

          if (resetTrackingRequested) {
            smoothedPoints = null;
            stablePoints = null;
            stableFrameCount = 0;
            missingFrames = 0;
            resetTrackingRequested = false;
          }

          if (isFading) {
            overlayOpacity -= 0.05;
            if (overlayOpacity < 0) overlayOpacity = 0;
          }

          hiddenCtx.drawImage(videoElement, 0, 0, width, height);
          const imageData = hiddenCtx.getImageData(0, 0, width, height);
          const src = cv.matFromImageData(imageData);

          cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);
          cv.GaussianBlur(gray, edges, new cv.Size(5, 5), 0, 0, cv.BORDER_DEFAULT);
          cv.Canny(edges, edges, 42, 130, 3, false);
          cv.morphologyEx(edges, edges, cv.MORPH_CLOSE, kernel);
          cv.dilate(edges, edges, kernel);

          const contours = new cv.MatVector();
          const hierarchy = new cv.Mat();
          cv.findContours(edges, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

          overlayCtx.clearRect(0, 0, width, height);
          let bestScore = -Infinity;
          let bestPoints = null;
          const srcW = cardMat ? cardMat.cols : 1;
          const srcH = cardMat ? cardMat.rows : 1;

          for (let i = 0; i < contours.size(); i++) {
            const cnt = contours.get(i);
            try {
              const area = cv.contourArea(cnt, false);
              if (area < frameArea * 0.0025) continue;

              const tmp = new cv.Mat();
              try {
                const peri = cv.arcLength(cnt, true);
                cv.approxPolyDP(cnt, tmp, 0.02 * peri, true);

                let pts = null;
                if (tmp.rows === 4 && cv.isContourConvex(tmp)) {
                  const data = tmp.data32S;
                  pts = [
                    { x: data[0], y: data[1] },
                    { x: data[2], y: data[3] },
                    { x: data[4], y: data[5] },
                    { x: data[6], y: data[7] }
                  ];
                } else if (tmp.rows >= 4 && tmp.rows <= 10) {
                  const rect = cv.minAreaRect(cnt);
                  const rectArea = Math.max(1, rect.size.width * rect.size.height);
                  const fillRatio = area / rectArea;
                  if (fillRatio >= 0.60) pts = rotatedRectToPoints(rect);
                }
                if (!pts) continue;

                let ordered = ensureAspectMatch(orderPointsClockwise(pts), srcW, srcH);
                ordered = clampQuad(ordered, width, height);
                const qArea = quadArea(ordered);
                const edgeMargin = Math.min(...ordered.map(p => Math.min(p.x, width - p.x, p.y, height - p.y)));
                const centerDist = distance(getQuadCenter(ordered), { x: width / 2, y: height / 2 });
                const nearCenterForAcquire = centerDist < Math.min(width, height) * 0.40;
                const fillRatio = area / Math.max(1, qArea);
                const shapeOkay = getMaxCosine(ordered) < 0.75 && isAspectRatioClose(ordered, srcW, srcH, 0.26);
                const sizeOkay = qArea > frameArea * 0.004 && qArea < frameArea * 0.40;
                const borderOkay = edgeMargin >= 2;
                const contourOkay = fillRatio > 0.50;
                const trackOkay = candidateMatchesTrack(ordered, stablePoints, width, height);
                const score = scoreCandidate(ordered, area, srcW, srcH, frameArea, width, height, stablePoints);

                if (shapeOkay && sizeOkay && borderOkay && contourOkay && trackOkay && (stablePoints || nearCenterForAcquire) && score > bestScore) {
                  bestScore = score;
                  bestPoints = ordered;
                }
              } finally {
                tmp.delete();
              }
            } finally {
              cnt.delete();
            }
          }

          if (bestPoints) {
            const jumpDistance = stablePoints ? averagePointDistance(bestPoints, stablePoints) : 0;
            if (!stablePoints || jumpDistance <= JUMP_REJECT_DISTANCE || replayRequested) {
              if (!stablePoints) {
                stablePoints = bestPoints;
                stableFrameCount = 1;
              } else {
                stablePoints = blendPoints(stablePoints, bestPoints, replayRequested ? 0.34 : 0.18);
                stableFrameCount++;
              }

              if (!smoothedPoints) {
                smoothedPoints = stablePoints.map(p => ({ ...p }));
              } else {
                const motion = averagePointDistance(stablePoints, smoothedPoints);
                let alpha = 0.12;
                if (motion > 14) alpha = 0.16;
                if (motion > 28) alpha = 0.21;
                if (motion > 45) alpha = 0.27;
                smoothedPoints = blendPoints(smoothedPoints, stablePoints, alpha);
              }
              missingFrames = 0;
              replayRequested = false;
            } else {
              missingFrames++;
            }
          } else {
            missingFrames++;
          }

          if (missingFrames >= MAX_MISSING_FRAMES) {
            smoothedPoints = null;
            stablePoints = null;
            stableFrameCount = 0;
          }

          if (smoothedPoints && stableFrameCount >= LOCK_AFTER_FRAMES && cardMat && overlayOpacity > 0) {
            const finalPoints = clampQuad(scaleQuad(ensureAspectMatch(smoothedPoints, cardMat.cols, cardMat.rows), 0.985), width, height);
            const srcPts = cv.matFromArray(4, 1, cv.CV_32FC2, [0,0, cardMat.cols,0, cardMat.cols,cardMat.rows, 0,cardMat.rows]);
            const dstPts = cv.matFromArray(4, 1, cv.CV_32FC2, [
              finalPoints[0].x, finalPoints[0].y,
              finalPoints[1].x, finalPoints[1].y,
              finalPoints[2].x, finalPoints[2].y,
              finalPoints[3].x, finalPoints[3].y
            ]);
            const M = cv.getPerspectiveTransform(srcPts, dstPts);
            const warped = new cv.Mat();
            cv.warpPerspective(cardMat, warped, M, new cv.Size(width, height), cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar(0,0,0,0));
            const imgData = new ImageData(new Uint8ClampedArray(warped.data), width, height);
            warpCtx.clearRect(0, 0, width, height);
            warpCtx.putImageData(imgData, 0, 0);
            overlayCtx.globalAlpha = overlayOpacity;
            overlayCtx.drawImage(warpCanvas, 0, 0);
            overlayCtx.globalAlpha = 1.0;
            srcPts.delete(); dstPts.delete(); M.delete(); warped.delete();
          }

          src.delete();
          contours.delete();
          hierarchy.delete();
          const delay = 1000 / FPS - (Date.now() - begin);
          setTimeout(processVideo, Math.max(0, delay));
        } catch (err) {
          console.error('影像處理錯誤:', err);
          setTimeout(processVideo, 1000);
        }
      }
      setTimeout(processVideo, 0);
    }
  </script>
